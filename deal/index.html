<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DealTo, achète et vends partout au Togo</title>
<meta name="description" content="DealTo : le marché d'occasion du Togo. Achète et vends près de chez toi.">
<meta name="theme-color" content="#262262">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deal.css">
</head>
<body>
<header>
  <div class="top"><div class="logo">Deal<span>To</span></div><button class="loc" id="locBtn">📍 <span id="locTxt">Toutes les villes</span></button></div>
  <div class="search"><span>🔍</span><input id="q" type="search" placeholder="Que cherches-tu ?" aria-label="Rechercher"><button id="filt" aria-label="Filtres">⚙</button></div>
  <div class="filters" id="filters" hidden>
    <select id="ville" aria-label="Ville"></select>
    <select id="tri" aria-label="Trier"><option value="new">Plus récents</option><option value="asc">Prix croissant</option><option value="desc">Prix décroissant</option></select>
  </div>
</header>
<main>
  <section class="hero">
    <small>DEALTO</small>
    <h1>VENDS EN<br><b>2 MINUTES</b></h1>
        <p>Une photo, un prix, c'est parti. On valide ton annonce.</p>
    <button class="cta" data-t="sell">Publier un article →</button>
    <div class="pics"><img src="../campus/sweat.jpg" alt=""><img src="../campus/naruto.jpg" alt=""></div>
  </section>
  <div class="cats" id="chips"></div>
  <div class="sec"><h2 id="stitle">Récemment ajoutés</h2><span id="count"></span></div>
  <div class="grid" id="grid"></div>
  <div class="trust"><div>✓<b>Vendeurs vérifiés</b></div><div>📍<b>Lieux publics</b></div><div>🛡<b>Annonces contrôlées</b></div></div>
  <footer>DealTo · fait au Togo par Ghost · <a href="../">mon portfolio</a></footer>
</main>
<nav class="tabs">
  <button data-t="home" class="on"><i>🏠</i>Accueil</button>
  <button data-t="cats"><i>🧭</i>Catégories</button>
  <button data-t="sell" class="plus"><i>＋</i>Vendre</button>
  <button data-t="fav"><i>♡</i>Favoris</button>
  <button data-t="me"><i>👤</i>Profil</button>
</nav>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>
<template id="sellT">
  <div class="form"><button class="x" data-close>✕</button>
    <h2>Vendre un article</h2>
    <p class="hint">Remplis, puis envoie sur WhatsApp avec 1 à 3 photos. On publie rapidement.</p>
    <label>Titre<input id="s_titre" placeholder="Ex : sac à dos noir"></label>
    <label>Description<textarea id="s_desc" rows="3" placeholder="Taille, couleur, défauts…"></textarea></label>
        <label>Prix (FCFA)<input id="s_prix" inputmode="numeric" placeholder="5000"></label>
    <label>Catégorie<select id="s_cat"></select></label>
    <label>État<select id="s_etat"><option>Neuf</option><option>Très bon état</option><option>Bon état</option><option>Usé mais fonctionne</option></select></label>
    <label>Ville<select id="s_ville"></select></label>
    <label>Quartier<input id="s_quartier" placeholder="Ex : Adidogomé"></label>
    <label>Ton numéro WhatsApp<input id="s_tel" inputmode="tel" placeholder="+228 …"></label>
    <a class="wa" id="sendSell" href="#" target="_blank" rel="noopener">Envoyer sur WhatsApp</a>
  </div>
</template>
<script src="deal.js"></script>
<script src="acct.js"></script>
<script src="fiche.js"></script>
<script src="ui.js"></script>
<script src="nav.js"></script>
<script src="glass.js"></script>
<script src="anim.js"></script>
<script src="rise.js"></script>
<script src="intro.js"></script>
<script src="cat.js"></script>
<script src="grid.js"></script>
<script src="boost.js"></script>
<script src="sponsor.js"></script>
<script src="pwa.js"></script>
</body>
</html>
