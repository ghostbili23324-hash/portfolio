<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Shop, le marché des étudiants</title>
<meta name="description" content="Achetez malin, payez moins ! Le marché d'occasion des étudiants de Lomé.">
<meta name="theme-color" content="#0D1B2A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header><div class="wrap">
  <div class="brand">Campus <span>Shop</span></div>
  <p>Achète et vends d'occasion entre étudiants de Lomé.</p>
  <div class="search"><input id="q" type="search" placeholder="Chercher : sac, chaussures, cours…" aria-label="Rechercher"></div>
</div></header>
<main>
  <div class="chips" id="chips"></div>
  <div class="bar">
    <select id="ecole" aria-label="École">
      <option value="">Toutes les écoles</option>
      <option>ESGIS</option><option>Université de Lomé</option><option>Université de Kara</option><option>Autre école</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <div class="grid" id="grid"></div>

  <section class="sell" id="vendre">
    <h2>Vendre un article</h2>
    <p class="meta">Remplis, puis envoie sur WhatsApp avec 1 à 3 photos. On publie ton annonce rapidement.</p>
    <div class="f">
      <div class="full"><label for="s_titre">Ce que tu vends</label><input id="s_titre" placeholder="Ex : sac à dos noir"></div>
      <div><label for="s_prix">Prix (FCFA)</label><input id="s_prix" inputmode="numeric" placeholder="5000"></div>
      <div><label for="s_cat">Catégorie</label><select id="s_cat"></select></div>
